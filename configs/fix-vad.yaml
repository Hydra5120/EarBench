# Fix rerun (Phase 6): the worst simulated cells only — TV noise at 2 m.
# Run twice with the same grid: once with vad_filter: false (before), once
# with vad_filter: true (after). Same clips + same seed = same audio, so the
# before/after delta is the VAD fix alone.
manifest_path: data/manifest.csv
clips_per_group: 10
distances_m: [2.0]
noise_files:
  tv: [data/noise/tv.wav]
snr_db: [10.0, 0.0]
include_clean: false
models: [tiny]
vad_filter: true
usable_wer: 0.20
bootstrap_iters: 100
seed: 0
room:
  dims_m: [5.0, 4.0, 2.7]
  rt60_s: 0.5
  mic_pos_m: [1.0, 2.0, 1.2]
  source_height_m: 1.2
  noise_pos_m: [4.5, 3.5, 1.0]
