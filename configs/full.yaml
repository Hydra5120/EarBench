# Full sweep (Phase 3): under an hour on the GPU, hours on CPU.
# GPU needs `uv sync --extra gpu`; for CPU set device: cpu, compute_type: int8.
manifest_path: data/manifest.csv
clips_per_group: null
distances_m: [1.0, 2.0, 3.0]
noise_files:
  living: [DLIVING/ch01.wav]
  kitchen: [DKITCHEN/ch01.wav]
  cafeteria: [PCAFETER/ch01.wav]
  tv: [data/noise/tv.wav]
snr_db: [20.0, 10.0, 5.0, 0.0]
include_clean: true
models: [tiny, base, small]
device: cuda
compute_type: float16
usable_wer: 0.20
bootstrap_iters: 1000
seed: 0
room:
  dims_m: [5.0, 4.0, 2.7]
  rt60_s: 0.5
  mic_pos_m: [1.0, 2.0, 1.2]
  source_height_m: 1.2
  noise_pos_m: [4.5, 3.5, 1.0]
