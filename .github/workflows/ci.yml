name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest

  # Build the site on every push so a broken build shows up before it can ship.
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      # Browser tests against the built site on Cloudflare's local runtime. The @slow ones
      # download Whisper (44 MB) and run locally with `npm run test:e2e:slow`.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          WRANGLER_SEND_METRICS: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          retention-days: 7

  # Deploy to Cloudflare only from master, and only when the checks and build passed.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [check, site]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-site
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          wranglerVersion: "4.147.0"
          command: deploy
