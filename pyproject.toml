[project]
name = "earbench"
version = "0.1.0"
description = "Test harness measuring how well off-the-shelf speech recognition hears older people in a noisy, aged-care-style room."
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2",
    "jiwer>=4.0",
    "matplotlib>=3.11.2",
    "numpy>=1.26",
    "pydantic>=2.0",
    "pyroomacoustics>=0.10.1",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "soundfile>=0.12",
    "tqdm>=4.66",
    "typer>=0.9",
    "whisper-normalizer>=0.1.15",
]

[project.scripts]
earbench = "earbench.cli:app"

[project.optional-dependencies]
gpu = [
    "nvidia-cublas-cu12>=12,<13 ; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12>=9,<10 ; sys_platform != 'darwin'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earbench"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pyright>=1.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs a real model, dataset, or the network (excluded from default runs)",
]
filterwarnings = [
    "error",
    # whisper-normalizer 0.1.15 has an invalid escape in a basic.py docstring; a
    # fresh install compiles it for the first time and Python raises a SyntaxWarning.
    "ignore:invalid escape sequence:SyntaxWarning",
]

[tool.typer.no-pretty]
