[project]
name = "earbench"
version = "0.1.0"
description = "Test harness measuring how well off-the-shelf speech recognition hears older people in a noisy, aged-care-style room."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.0",
    "pyroomacoustics>=0.10.1",
    "pyyaml>=6.0",
    "soundfile>=0.12",
    "typer>=0.9",
]

[project.scripts]
earbench = "earbench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earbench"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pyright>=1.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs a real model, dataset, or the network (excluded from default runs)",
]
filterwarnings = ["error"]

[tool.typer.no-pretty]
